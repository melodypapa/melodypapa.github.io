site_name: 米多papa的小屋
site_description: A slow sparrow should make an early start. Learning a endless life
site_url: https://melodypapa.github.io/
repo_url: https://github.com/melodypapa/melodypapa.github.io
repo_name: melodypapa/melodypapa.github.io
copyright: Copyright &copy; melodypapa

theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: 切换到系统模式
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - blog:
      blog_dir: blog

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

# 写作标准与进度文件仅入库存档，不发布到站点
exclude_docs: |
  autosar/STANDARD.md
  autosar/TODO.md
  autosar/sync-todo/

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

