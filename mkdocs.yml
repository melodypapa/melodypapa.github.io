extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

# 写作标准与进度文件仅入库存档，不发布到站点
exclude_docs: |
  autosar/STANDARD.md
  autosar/TODO.md
  autosar/sync-todo/
  cortex/sync-todo/
  nxp/s32g3/TODO.md
  nxp/s32g3/sync-todo/

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

