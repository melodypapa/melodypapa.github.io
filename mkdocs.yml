site_name: 米多papa的小屋
site_description: A slow sparrow should make an early start. Learning a endless life
site_url: https://melodypapa.github.io/
repo_url: https://github.com/melodypapa/melodypapa.github.io
repo_name: melodypapa/melodypapa.github.io
copyright: Copyright &copy; melodypapa

theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: 切换到系统模式
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

